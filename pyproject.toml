[project]
name = "mushin"
version = "0.1.0"
description = "Arbitrary workflow composer / validator."
readme = "README.md"
authors = [
    { name = "Jonathan Bailey", email = "jonathan.bailey@comcast.net" }
]
requires-python = ">=3.12"
dependencies = [
    "guessit>=3.8,<4",
    "pydantic>=2.14.3",
    "pyyaml>=6,<7",
]

[project.scripts]
mushin = "mushin:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
